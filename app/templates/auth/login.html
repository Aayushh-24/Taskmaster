{% extends "base.html" %}
{% block title %}Login — TaskMaster{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-brand">
        <div class="brand-mark">TM</div>
        <h1>Task<span>Master</span></h1>
        <p>Manage. Track. Dominate.</p>
    </div>

    <div class="auth-card">
        <div class="auth-card-header">
            <h2>Welcome back</h2>
            <p>Sign in to your workspace</p>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="form-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="remember" name="remember">
                    <span>Remember me</span>
                </label>
            </div>
            <div id="authError" class="auth-error" style="display:none;"></div>
            <button type="submit" class="btn-primary" id="loginBtn">
                <span>Sign In</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </form>

        <div class="auth-footer">
            <p>No account? <a href="{{ url_for('auth.register') }}">Create one free</a></p>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('authError');
    btn.disabled = true;
    btn.innerHTML = '<span>Signing in…</span>';
    errEl.style.display = 'none';

    const res = await fetch('/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            remember: document.getElementById('remember').checked,
        })
    });
    const data = await res.json();
    if (data.success) {
        window.location.href = '/dashboard';
    } else {
        errEl.textContent = data.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
    }
});
</script>
{% endblock %}
